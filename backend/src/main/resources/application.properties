spring.application.name=backend
robot.device-id=${ROBOT_DEVICE_ID:}
robot.device-token=${ROBOT_DEVICE_TOKEN:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.datasource.url=jdbc:postgresql://project-db-campus.smhrd.com:3310/campus_lgdx_2
spring.datasource.username=campus_lgdx_2
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# Temporary schedule: daily 00:05 in Asia/Seoul. Disable with PROFILE_REFRESH_ENABLED=false.
safety.profile-refresh.enabled=${PROFILE_REFRESH_ENABLED:true}
safety.profile-refresh.cron=${PROFILE_REFRESH_CRON:0 5 0 * * *}

# Temporary telemetry freshness window. Expired values are UNKNOWN, not OFFLINE.
device.status-max-age-seconds=${DEVICE_STATUS_MAX_AGE_SECONDS:300}
